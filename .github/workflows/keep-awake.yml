# Render's free plan puts the bot to sleep after ~15 idle minutes, and waking it takes up to a minute.
# This pings it every 10 minutes so replies stay fast. (GitHub may delay scheduled runs a little.)
name: Keep Render awake
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - run: curl -s -o /dev/null -w "HTTP %{http_code} in %{time_total}s\n" --max-time 90 https://geminibot-hxnj.onrender.com/ || true
