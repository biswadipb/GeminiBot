<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Laden Games</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root {
    --bg: var(--tg-theme-bg-color, #ffffff);
    --text: var(--tg-theme-text-color, #1d1d1f);
    --hint: var(--tg-theme-hint-color, #8a8a8e);
    --button: var(--tg-theme-button-color, #2f7de1);
    --button-text: var(--tg-theme-button-text-color, #ffffff);
    --card: var(--tg-theme-secondary-bg-color, #f2f2f5);
    --light: #eedab6;
    --dark: #b48764;
    --felt: #2e8b57;
    --felt-line: #1f6b41;
    --wood: #dcb35c;
    --wood-line: #6b4a1b;
    --select: rgba(255, 214, 0, .55);
    --last: rgba(155, 199, 0, .45);
    --danger: #d64545;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0; padding: 12px 16px 24px; background: var(--bg); color: var(--text);
    font: 15px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    user-select: none; -webkit-user-select: none;
  }
  .wrap { max-width: 480px; margin: 0 auto; }
  .player { display: flex; align-items: center; gap: 8px; padding: 8px 2px; font-weight: 600; }
  .player .dot { flex: none; width: 14px; height: 14px; border-radius: 50%; border: 1.5px solid var(--hint); }
  .player .dot.white { background: #fff; }
  .player .dot.black { background: #222; }
  .player .info { flex: 1; min-width: 0; }
  .player .name { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .player .turn { font-size: 13px; font-weight: 500; color: var(--button); }
  .taken { display: flex; align-items: center; min-height: 20px; margin-top: 1px; font-size: 12px; font-weight: 600; color: var(--hint); }
  .taken .cap { position: relative; width: 20px; height: 20px; margin-right: -6px; filter: drop-shadow(0 0 1px var(--hint)); }
  .taken .cap.gap { margin-left: 7px; }
  .taken .cap svg { display: block; width: 100%; height: 100%; }
  .taken .adv { margin-left: 9px; }
  .taken .chip { width: 13px; height: 13px; border-radius: 50%; margin-right: -4px; border: 1px solid #0006; }
  .taken .chip.w { background: #f4f4f4; } .taken .chip.b { background: #222; }
  .taken .count { margin-left: 8px; }
  .clock {
    min-width: 64px; padding: 3px 8px; border-radius: 7px; text-align: center; background: var(--card);
    font-variant-numeric: tabular-nums; font-size: 17px;
  }
  .clock.running { background: var(--button); color: var(--button-text); }
  .clock.low.running { background: var(--danger); color: #fff; }

  .board {
    display: grid; width: 100%; aspect-ratio: 1; border-radius: 6px; overflow: hidden;
    box-shadow: 0 2px 10px rgba(0,0,0,.15);
  }
  .sq { position: relative; display: flex; align-items: center; justify-content: center; }
  .sq.l { background: var(--light); }
  .sq.d { background: var(--dark); }
  .sq.last::before, .sq.sel::before { content: ""; position: absolute; inset: 0; }
  .sq.last::before { background: var(--last); }
  .sq.sel::before { background: var(--select); }
  .sq.check { background: radial-gradient(circle, #ff3b30 0%, rgba(255,59,48,.5) 45%, transparent 75%), var(--dark); }
  .sq.l.check { background: radial-gradient(circle, #ff3b30 0%, rgba(255,59,48,.5) 45%, transparent 75%), var(--light); }
  .sq.target::after {
    content: ""; position: absolute; z-index: 3; width: 30%; height: 30%; border-radius: 50%; background: rgba(0,0,0,.22);
  }
  .sq.target.capture::after { width: 88%; height: 88%; background: none; border: 4px solid rgba(0,0,0,.22); }
  .coord { position: absolute; z-index: 2; font-size: 10px; font-weight: 700; opacity: .7; pointer-events: none; }
  .coord.file { right: 3px; bottom: 1px; }
  .coord.rank { left: 3px; top: 1px; }
  .sq.l .coord { color: var(--dark); }
  .sq.d .coord { color: var(--light); }
  .piece { position: absolute; inset: 0; z-index: 1; pointer-events: none; }
  .piece svg { display: block; width: 100%; height: 100%; }

  /* framed boards: othello, checkers, draughts, go */
  .board.othello, .board.checkers, .board.draughts, .board.go {
    position: relative; padding: 3.4%; border-radius: 12px; overflow: visible;
    box-shadow: 0 8px 18px rgba(0,0,0,.3), inset 0 1px 0 rgba(255,255,255,.18), inset 0 -2px 0 rgba(0,0,0,.25);
  }
  /* othello: green felt in a dark wooden frame, with the four guide dots */
  .board.othello { gap: 2px; background: linear-gradient(135deg, #6b4428, #3b2414 55%, #6b4428); }
  .board.othello .sq { background: radial-gradient(circle at 50% 35%, #33a565, #237f4a 80%); border-radius: 2px; }
  .board.othello .sq.last::before { background: rgba(255,255,255,.16); border-radius: 2px; }
  .board.othello .sq.target::after { width: 24%; height: 24%; background: rgba(0,0,0,.3); }
  .board .guide { position: absolute; z-index: 2; width: 2.4%; height: 2.4%; border-radius: 50%; background: #0f3a20;
                  transform: translate(-50%, -50%); pointer-events: none; }
  /* round pieces: othello discs, draughts men and go stones */
  .disc {
    position: relative; z-index: 1; width: 82%; height: 82%; border-radius: 50%; pointer-events: none;
    display: flex; align-items: center; justify-content: center;
  }
  .disc.b { background: radial-gradient(circle at 32% 28%, #7d7d7d 0, #2c2c2c 36%, #0a0a0a 72%);
            box-shadow: 0 3px 4px rgba(0,0,0,.55), inset 0 -2px 3px rgba(255,255,255,.08); }
  .disc.w { background: radial-gradient(circle at 32% 28%, #fff 0, #f2f0ea 40%, #c9c4b8 82%);
            box-shadow: 0 3px 4px rgba(0,0,0,.42), inset 0 -2px 4px rgba(0,0,0,.14); }
  .disc svg { width: 58%; height: 58%; filter: drop-shadow(0 1px 1px rgba(0,0,0,.5)); }
  /* checkers and turkish draughts: walnut frame, wood squares, ridged men */
  .board.checkers, .board.draughts { background: linear-gradient(135deg, #5a341b, #2d190b 55%, #5a341b); }
  .board.checkers .sq.l, .board.draughts .sq.l { background: linear-gradient(135deg, #f6e4c3, #e7cb9e); }
  .board.checkers .sq.d, .board.draughts .sq.d {
    background: repeating-linear-gradient(97deg, rgba(0,0,0,.06) 0 2px, transparent 2px 6px), linear-gradient(135deg, #8a5630, #6b3f20);
  }
  .board.checkers .disc, .board.draughts .disc { width: 80%; height: 80%; }
  .board.checkers .disc.b, .board.draughts .disc.b {
    background: radial-gradient(circle, #323232 0 28%, #121212 29% 34%, #2c2c2c 35% 50%, #0e0e0e 51% 56%, #3a3a3a 57% 100%);
    border: 2px solid #050505; box-shadow: 0 4px 5px rgba(0,0,0,.55), inset 0 2px 2px rgba(255,255,255,.22);
  }
  .board.checkers .disc.w, .board.draughts .disc.w {
    background: radial-gradient(circle, #fbf3e3 0 28%, #d4bf98 29% 34%, #f6ecd8 35% 50%, #cdb68c 51% 56%, #fff8ea 57% 100%);
    border: 2px solid #a88d62; box-shadow: 0 4px 5px rgba(0,0,0,.45), inset 0 2px 2px rgba(255,255,255,.7);
  }
  /* go: grained wood in a frame, slate and shell stones */
  .board.go {
    padding: 2.6%;
    background: repeating-linear-gradient(91deg, rgba(110,60,15,.08) 0 2px, transparent 2px 10px),
                repeating-linear-gradient(88deg, rgba(255,255,255,.07) 0 1px, transparent 1px 13px),
                linear-gradient(135deg, #ecc77c, #d8a64b 55%, #e6bd6c);
    border: 7px solid #6e4520;
  }
  .board.go .sq { background: none; }
  .board.go .sq .line-h, .board.go .sq .line-v { position: absolute; background: #3b2810; pointer-events: none; }
  .board.go .sq .line-h { height: 1.2px; top: 50%; left: 0; right: 0; }
  .board.go .sq .line-v { width: 1.2px; left: 50%; top: 0; bottom: 0; }
  .board.go .sq.left .line-h { left: 50%; } .board.go .sq.right .line-h { right: 50%; }
  .board.go .sq.top .line-v { top: 50%; } .board.go .sq.bottom .line-v { bottom: 50%; }
  .board.go .sq.top .line-h, .board.go .sq.bottom .line-h { height: 2px; }
  .board.go .sq.left .line-v, .board.go .sq.right .line-v { width: 2px; }
  .board.go .star { position: absolute; width: 18%; height: 18%; border-radius: 50%; background: #3b2810; }
  .board.go .disc { width: 94%; height: 94%; }
  .board.go .disc.b { background: radial-gradient(circle at 34% 28%, #6e6e6e 0, #242424 38%, #050505 75%);
                      box-shadow: 1px 3px 4px rgba(0,0,0,.55); }
  .board.go .disc.w { background: radial-gradient(circle at 34% 28%, #fff 0, #f0eee8 45%, #c3beb1 90%);
                      box-shadow: 1px 3px 4px rgba(0,0,0,.42); }
  .board.go .sq.last .disc::after { content: ""; width: 36%; height: 36%; border-radius: 50%; border: 2px solid #e53935; }
  .board.go .sq.last::before { background: none; }
  .board.go .sq.target::after { width: 22%; height: 22%; background: rgba(0,0,0,.2); }

  /* alquerque, 16 beads and fanorona: a carved wooden board drawn in SVG */
  .board.lines { display: block; margin: 0 auto; background: none; padding: 0; border-radius: 14px;
                 box-shadow: 0 8px 18px rgba(0,0,0,.3); }
  .board.lines svg { display: block; width: 100%; height: 100%; }

  .status { min-height: 22px; margin: 10px 2px 4px; text-align: center; color: var(--hint); font-size: 14px; }
  .status.strong { color: var(--text); font-weight: 600; }
  .actions { display: flex; gap: 8px; margin-top: 10px; }
  button {
    flex: 1; padding: 11px 12px; border: 0; border-radius: 10px; font: inherit; font-weight: 600;
    background: var(--card); color: var(--text); cursor: pointer;
  }
  button.primary { background: var(--button); color: var(--button-text); }
  button.danger { color: var(--danger); }
  button:disabled { opacity: .45; }
  .nav { display: flex; gap: 8px; margin-top: 10px; }
  .nav button { padding: 8px 10px; font-size: 18px; line-height: 1; }
  .nav .step { flex: 0 0 56px; }
  .nav .list { font-size: 15px; }
  .review { color: var(--button); font-weight: 600; }
  .review a { color: var(--button); text-decoration: underline; cursor: pointer; }
  .card { background: var(--card); border-radius: 12px; padding: 18px 16px; text-align: center; margin-top: 24px; }
  .card h2 { margin: 0 0 6px; font-size: 20px; }
  .card p { margin: 6px 0 14px; color: var(--hint); }
  .big { font-size: 48px; line-height: 1; margin-bottom: 8px; }
  .promo { position: fixed; inset: 0; background: rgba(0,0,0,.45); display: none; align-items: center; justify-content: center; z-index: 5; }
  .promo.open { display: flex; }
  .promo div { background: var(--bg); border-radius: 14px; padding: 14px; display: flex; gap: 8px; }
  .promo button { position: relative; width: 60px; height: 60px; flex: none; padding: 4px; }
  .sheet { position: fixed; inset: 0; z-index: 6; display: none; background: rgba(0,0,0,.45); }
  .sheet.open { display: flex; align-items: flex-end; }
  .sheet .panel {
    width: 100%; max-width: 480px; margin: 0 auto; max-height: 70vh; display: flex; flex-direction: column;
    background: var(--bg); border-radius: 16px 16px 0 0; padding: 14px 16px 18px;
  }
  .sheet h3 { margin: 0 0 10px; font-size: 17px; text-align: center; }
  .movelist { overflow-y: auto; display: grid; grid-template-columns: 34px 1fr 1fr; row-gap: 2px; margin-bottom: 12px; }
  .movelist .no { color: var(--hint); padding: 7px 0; font-size: 14px; }
  .movelist .mv { padding: 7px 8px; border-radius: 7px; cursor: pointer; font-weight: 500; }
  .movelist .mv.on { background: var(--button); color: var(--button-text); }
  .movelist .empty { grid-column: 1 / -1; text-align: center; color: var(--hint); padding: 16px 0; }
  /* dice games */
  .plist { display: flex; flex-wrap: wrap; gap: 6px; margin: 4px 0 10px; }
  .pchip {
    display: flex; align-items: center; gap: 6px; padding: 5px 9px; border-radius: 16px; background: var(--card);
    font-size: 13px; font-weight: 600; border: 2px solid transparent;
  }
  .pchip.turn { border-color: var(--button); }
  .pchip .pdot { width: 12px; height: 12px; border-radius: 50%; border: 1px solid #0005; }
  .pchip .pinfo { font-weight: 500; color: var(--hint); }
  #pboard svg { display: block; width: 100%; height: auto; border-radius: 14px; box-shadow: 0 8px 18px rgba(0,0,0,.28); }
  .dicebar { display: flex; align-items: center; gap: 12px; margin-top: 12px; }
  .die { width: 56px; height: 56px; flex: none; border-radius: 12px; background: var(--card); display: flex;
         align-items: center; justify-content: center; font-size: 46px; line-height: 1; }
  .die.rolling { animation: shake .35s; }
  @keyframes shake { 25% { transform: rotate(-14deg); } 75% { transform: rotate(14deg); } }
  .dicebar .status { flex: 1; margin: 0; text-align: left; }
  .dicebar button { flex: 0 0 96px; }
  .plog { margin-top: 12px; font-size: 13px; color: var(--hint); }
  .plog div { padding: 3px 0; border-bottom: 1px solid var(--card); }
  .plog div:first-child { color: var(--text); font-weight: 600; }
  .token.can { animation: pulse 1s infinite; }
  @keyframes pulse { 50% { opacity: .45; } }
  .hidden { display: none !important; }
</style>
</head>
<body>
<div class="wrap">
  <div id="message" class="card hidden"></div>
  <div id="game" class="hidden">
    <div class="player" id="topPlayer"></div>
    <div class="board" id="board"></div>
    <div class="player" id="bottomPlayer"></div>
    <div class="nav">
      <button class="step" id="prev" onclick="step(-1)" aria-label="Previous move">◀</button>
      <button class="list" onclick="openMoves()">Moves</button>
      <button class="step" id="next" onclick="step(1)" aria-label="Next move">▶</button>
    </div>
    <div class="status" id="status"></div>
    <div class="actions" id="actions"></div>
  </div>
</div>
<div id="party" class="hidden wrap">
  <div class="plist" id="plist"></div>
  <div id="pboard"></div>
  <div class="dicebar"><div class="die" id="die">🎲</div><div class="status" id="pstatus"></div>
    <button class="primary" id="rollBtn" onclick="roll()">Roll</button></div>
  <div class="plog" id="plog"></div>
  <div class="actions"><button class="danger hidden" id="leaveBtn" onclick="leaveParty()">Leave game</button></div>
</div>
<div class="promo" id="promo"><div id="promoChoices"></div></div>
<div class="sheet" id="sheet" onclick="if (event.target === this) closeMoves()">
  <div class="panel">
    <h3>Moves</h3>
    <div class="movelist" id="movelist"></div>
    <button onclick="closeMoves()">Close</button>
  </div>
</div>

<script>
const tg = window.Telegram && Telegram.WebApp;
if (tg) { tg.ready(); tg.expand(); }
const params = new URLSearchParams(location.search);
const gameId = (tg && tg.initDataUnsafe && tg.initDataUnsafe.start_param) || params.get("game") || "";
// Pieces: the "cburnett" set by Colin M.L. Burnett (GPLv2+), as used on lichess.org
const PIECES = {

  bK: "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 45 45\"><g fill=\"none\" fill-rule=\"evenodd\" stroke=\"#000\" stroke-linecap=\"round\" stroke-linejoin=\"round\" stroke-width=\"1.5\"><path stroke-linejoin=\"miter\" d=\"M22.5 11.6V6\"/><path fill=\"#000\" stroke-linecap=\"butt\" stroke-linejoin=\"miter\" d=\"M22.5 25s4.5-7.5 3-10.5c0 0-1-2.5-3-2.5s-3 2.5-3 2.5c-1.5 3 3 10.5 3 10.5\"/><path fill=\"#000\" d=\"M11.5 37a22.3 22.3 0 0 0 21 0v-7s9-4.5 6-10.5c-4-6.5-13.5-3.5-16 4V27v-3.5c-3.5-7.5-13-10.5-16-4-3 6 5 10 5 10z\"/><path stroke-linejoin=\"miter\" d=\"M20 8h5\"/><path stroke=\"#ececec\" d=\"M32 29.5s8.5-4 6-9.7C34.1 14 25 18 22.5 24.6v2.1-2.1C20 18 9.9 14 7 19.9c-2.5 5.6 4.8 9 4.8 9\"/><path stroke=\"#ececec\" d=\"M11.5 30c5.5-3 15.5-3 21 0m-21 3.5c5.5-3 15.5-3 21 0m-21 3.5c5.5-3 15.5-3 21 0\"/></g></svg>",

  bP: "<svg xmlns=\"http://www.w3.org/2000/svg\" width=\"45\" height=\"45\" viewBox=\"0 0 45 45\"><path stroke=\"#000\" stroke-linecap=\"round\" stroke-width=\"1.5\" d=\"M22.5 9a4 4 0 0 0-3.22 6.38 6.48 6.48 0 0 0-.87 10.65c-3 1.06-7.41 5.55-7.41 13.47h23c0-7.92-4.41-12.41-7.41-13.47a6.46 6.46 0 0 0-.87-10.65A4.01 4.01 0 0 0 22.5 9z\"/></svg>",

async function api(action, extra) {
  // give up on a request that hangs (a dropped connection), so the board never stays stuck waiting for it
  const abort = new AbortController(), timer = setTimeout(() => abort.abort(), 12000);
  let r;
  try {
    r = await fetch("/chess/api", {
      method: "POST", headers: { "Content-Type": "application/json" }, signal: abort.signal,
      body: JSON.stringify({ action, game: gameId, initData: tg ? tg.initData : "", ...extra }),
    });
  } catch (e) { throw new Error("Connection problem. Try again."); }
  finally { clearTimeout(timer); }
  const data = await r.json().catch(() => ({ error: "Connection problem. Try again." }));
  if (data.error && !data.status) throw new Error(data.error);
  if (data.error && tg) tg.showAlert(data.error);
  data.receivedAt = performance.now();  // clocks count down locally from here
  return data;
}

function showMessage(html) {
  document.getElementById("game").classList.add("hidden");
  document.getElementById("party").classList.add("hidden");
  const m = document.getElementById("message");
  m.innerHTML = html; m.classList.remove("hidden");
}

// ---------- reading boards (one character per square, top row first; chess uses FEN)

function parseFen(fen) {
  const grid = {};
  fen.split(" ")[0].split("/").forEach((row, r) => {
    let f = 0;
    for (const ch of row) {
      if (/\d/.test(ch)) { f += +ch; continue; }
      grid["abcdefgh"[f] + (8 - r)] = ch;
      f++;
    }
  });
  return grid;
}

function checkersNumber(r, c) { return (r + c) % 2 === 1 ? String(r * 4 + Math.floor(c / 2) + 1) : null; }
function squareName(kind, r, c) {
  if (kind === "othello") return "abcdefgh"[c] + (r + 1);
  if (kind === "checkers") return checkersNumber(r, c);
  if (kind === "draughts") return "abcdefgh"[c] + (8 - r);
  if (kind === "go") return GO_LETTERS[c] + (9 - r);
}
function moveSquares(kind, move) {
  // squares to highlight for a move
  if (!move || move === "pass") return [];
  if (kind === "chess") return [move.slice(0, 2), move.slice(2, 4)];
  if (kind === "checkers" || kind === "draughts" || state.layout) return pathOf(move);
  return [move];
}

// ---------- drawing

function render() {
  const s = state;
  if (s.party) return renderParty();
  const emoji = EMOJI[s.kind] || "♟";
  if (s.status === "waiting") {
    const who = s.invited ? `${esc(s.host)} challenged <b>${esc(s.invited)}</b>.` : `${esc(s.host)} is waiting for an opponent.`;
    let html = `<div class="big">${emoji}</div><h2>${esc(s.title)} match</h2><p>${who}</p>`;
    if (s.can_join) html += `<button class="primary" onclick="act('join')">Join the game</button>`;
    else html += `<p>Waiting for ${s.invited ? esc(s.invited) : "someone"} to join…</p>`;
    if (s.can_cancel) html += `<div class="actions"><button class="danger" onclick="act('cancel')">Cancel game</button></div>`;
    return showMessage(html);
  }
  if (s.status === "private") {
    return showMessage(`<div class="big">🔒</div><h2>${esc(s.white)} vs ${esc(s.black)}</h2>
      <p>This game is private while it's being played. Laden will post the result and the moves in the group when it ends.</p>`);
  }
  if (!s.board) {
    return showMessage(`<div class="big">${emoji}</div><h2>Game cancelled</h2><p>Start a new one in the group.</p>`);
  }
  document.getElementById("message").classList.add("hidden");
  document.getElementById("game").classList.remove("hidden");

  if (viewPly !== null && viewPly >= s.positions.length - 1) viewPly = null;  // caught up with the live position
  const reviewing = viewPly !== null;
  const snapshot = reviewing ? s.positions[viewPly] : s.board;
  const last = reviewing ? (viewPly > 0 ? s.moves[viewPly - 1] : null) : s.moves[s.moves.length - 1];
  if (reviewing) selected = null;
  const myTurn = s.status === "playing" && s.you === s.turn;
  const legal = reviewing || !myTurn ? [] : (s.legal || []);

  const board = document.getElementById("board");
  board.className = `board ${s.kind}`;
  board.innerHTML = "";
  board.removeAttribute("style");
  if (s.layout) drawLines(board, snapshot, last, legal);
  else if (s.kind === "chess") drawChess(board, snapshot, last, legal, reviewing);
  else if (s.kind === "go") drawGo(board, snapshot, last, legal);
  else drawGrid(board, s.kind, snapshot, last, legal);

  const me = s.you, them = other(me || "white");
  const bottom = me || s.first, top = other(bottom);
  const extras = sideInfo(s.kind, snapshot, reviewing);
  const line = c => `<span class="dot ${c}"></span><span class="info"><span class="name">${esc(s[c])}</span>${extras[c]}</span>` +
    (s.status === "playing" && s.turn === c && s.away === c ? `<span class="turn">offline</span>` :
     s.status === "playing" && s.turn === c && !s.running ? `<span class="turn">to move</span>` : "") +
    (s.clock ? `<span class="clock" data-color="${c}"></span>` : "");
  document.getElementById("topPlayer").innerHTML = line(top);
  document.getElementById("bottomPlayer").innerHTML = line(bottom);

  const status = document.getElementById("status");
  status.className = "status";
  document.getElementById("prev").disabled = (reviewing ? viewPly : s.labels.length) === 0;
  document.getElementById("next").disabled = !reviewing;
  const theyPassed = s.moves.length && s.moves[s.moves.length - 1] === "pass";
  if (reviewing) {
    status.innerHTML = `<span class="review">${viewPly ? `After ${esc(moveLabel(viewPly))}` : "Starting position"}` +
      ` · <a onclick="goLive()">back to the game</a></span>`;
  } else if (s.status === "over") {
    const winner = s.result === "white" || s.result === "black" ? s[s.result] : null;
    status.textContent = winner ? `${winner} won by ${s.reason}.` : `Draw by ${s.reason}.`;
    status.classList.add("strong");
  } else if (s.draw_offer === "them") {
    status.textContent = `${s[them]} offers a draw.`; status.classList.add("strong");
  } else if (myTurn) {
    let text = s.check ? "Check! Your move." : "Your move.";
    if (theyPassed) text = s.kind === "go" ? `${s[them]} passed. Pass too to end the game, or play on.` : `${s[them]} had no moves and passed. Your move.`;
    status.textContent = text; status.classList.add("strong");
  } else {
    status.textContent = s.draw_offer === "you" ? "Draw offered. Waiting for your opponent…" :
      s.bot ? `${s[them]} is thinking…` : `Waiting for ${s[them]}…`;
  }
  if (!reviewing && s.status === "playing" && s.away) {
    const m = Math.floor(s.away_left / 60), sec = String(s.away_left % 60).padStart(2, "0");
    status.textContent = `${s[s.away]}'s connection dropped. Their clock is paused; they lose if they're not back within ${m}:${sec}.`;
  } else if (!reviewing && s.status === "playing" && s.clock && !s.running) status.textContent += " Clocks start after both sides' first moves.";
  tickClocks();

  const actions = document.getElementById("actions");
  if (s.status !== "playing") actions.innerHTML = "";
  else if (s.draw_offer === "them") actions.innerHTML =
    `<button class="primary" onclick="act('accept_draw')">Accept draw</button><button onclick="act('decline_draw')">Decline</button>`;
  else if (s.kind === "fanorona" && fpath.length > 1) actions.innerHTML =
    (fanoronaChoices().some(c => c.pts.length === fpath.length) ? `<button class="primary" onclick="endFanoronaTurn()">End turn</button>` : "") +
    `<button onclick="cancelFanorona()">Cancel</button>`;
  else actions.innerHTML =
    (s.kind === "go" ? `<button onclick="send('pass')" ${myTurn && !reviewing ? "" : "disabled"}>Pass</button>` : "") +
    (s.bot ? "" : `<button onclick="act('offer_draw')" ${s.draw_offer ? "disabled" : ""}>Offer draw</button>`) +
    `<button class="danger" onclick="resign()">Resign</button>`;

  if (document.getElementById("sheet").classList.contains("open")) fillMoves();
}

function drawChess(board, snapshot, last, legal, reviewing) {
  const s = state, flip = s.you === "black", grid = parseFen(snapshot);
  const lit = moveSquares("chess", last);
  const targets = selected ? legal.filter(m => m.startsWith(selected)).map(m => m.slice(2, 4)) : [];
  board.style.gridTemplateColumns = "repeat(8, 1fr)";
  for (let r = 0; r < 8; r++) {
    for (let f = 0; f < 8; f++) {
      const file = "abcdefgh"[flip ? 7 - f : f], rank = flip ? r + 1 : 8 - r, sq = file + rank;
      const el = document.createElement("div");
      el.className = "sq " + ((f + r) % 2 ? "d" : "l");
      if (lit.includes(sq)) el.classList.add("last");
      if (sq === selected) el.classList.add("sel");
      if (sq === s.check && !reviewing) el.classList.add("check");
      if (targets.includes(sq)) el.classList.add("target", ...(grid[sq] ? ["capture"] : []));
      const p = grid[sq];
      if (p) el.innerHTML = `<span class="piece">${PIECES[(p === p.toUpperCase() ? "w" : "b") + p.toUpperCase()]}</span>`;
      if (r === 7) el.insertAdjacentHTML("beforeend", `<span class="coord file">${file}</span>`);
      if (f === 0) el.insertAdjacentHTML("beforeend", `<span class="coord rank">${rank}</span>`);
      el.onclick = () => tapChess(sq, grid, legal);
      board.appendChild(el);
    }
  }
}

function drawGrid(board, kind, snapshot, last, legal) {

}

function drawGo(board, snapshot, last, legal) {

      const el = document.createElement("div");
      el.className = "sq" + (c === 0 ? " left" : "") + (c === 8 ? " right" : "") + (r === 0 ? " top" : "") + (r === 8 ? " bottom" : "");
      el.innerHTML = `<span class="line-h"></span><span class="line-v"></span>` + (stars.includes(name) ? `<span class="star"></span>` : "");
      if (name === last) el.classList.add("last");
      if (p === "." && legal.includes(name)) el.classList.add("target");
      if (p !== ".") el.insertAdjacentHTML("beforeend", `<span class="disc ${p}"></span>`);

function drawLines(board, snapshot, last, legal) {

  const movers = fanorona && !fpath.length ? [...new Set(fanoronaChoices().map(c => c.pts[0] - 1))] : [];
  let svg = `<svg viewBox="${minX - pad} ${minY - pad} ${w} ${h}" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <linearGradient id="frame" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7a4a24"/><stop offset=".5" stop-color="#4e2c12"/><stop offset="1" stop-color="#7a4a24"/></linearGradient>
      <linearGradient id="inlay" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f2dcae"/><stop offset="1" stop-color="#ddbb82"/></linearGradient>
      <pattern id="grain" width=".9" height=".9" patternUnits="userSpaceOnUse" patternTransform="rotate(8)"><rect width=".9" height=".05" fill="rgba(120,70,20,.08)"/></pattern>
      <radialGradient id="gb" cx=".34" cy=".3" r=".7"><stop offset="0" stop-color="#8a8a8a"/><stop offset=".35" stop-color="#2a2a2a"/><stop offset="1" stop-color="#050505"/></radialGradient>
      <radialGradient id="gw" cx=".34" cy=".3" r=".75"><stop offset="0" stop-color="#ffffff"/><stop offset=".45" stop-color="#f1ede4"/><stop offset="1" stop-color="#bdb5a3"/></radialGradient>
    </defs>
    <rect x="${minX - pad}" y="${minY - pad}" width="${w}" height="${h}" rx=".35" fill="url(#frame)"/>
    <rect x="${minX - pad + .16}" y="${minY - pad + .16}" width="${w - .32}" height="${h - .32}" rx=".22" fill="url(#inlay)"/>
    <rect x="${minX - pad + .16}" y="${minY - pad + .16}" width="${w - .32}" height="${h - .32}" rx=".22" fill="url(#grain)"/>`;
  for (const [a, b] of L.segments) {  // engraved lines: a light edge under a dark groove
    const [x1, y1] = at(a), [x2, y2] = at(b);
    svg += `<line x1="${x1 + .015}" y1="${y1 + .025}" x2="${x2 + .015}" y2="${y2 + .025}" stroke="#fff4dc" stroke-width=".05" stroke-linecap="round"/>` +
      `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="#5c3a17" stroke-width=".05" stroke-linecap="round"/>`;
  }
  snapshot.split("").forEach((p, i) => {
    const [x, y] = at(i);
    svg += `<circle cx="${x}" cy="${y}" r=".1" fill="#4a2e12"/><circle cx="${x + .02}" cy="${y + .03}" r=".06" fill="#2e1c0a"/>`;
    if (lit.includes(i)) svg += `<circle cx="${x}" cy="${y}" r=".45" fill="rgba(120,180,0,.45)"/>`;
    if (String(i + 1) === pick) svg += `<circle cx="${x}" cy="${y}" r=".47" fill="rgba(255,214,0,.7)"/>`;
    if (visited.includes(i)) svg += `<circle cx="${x}" cy="${y}" r=".2" fill="rgba(255,214,0,.85)"/>`;
    if (p !== ".") {  // glass marbles with a shadow and a shine
      const side = p.toLowerCase();
      svg += `<ellipse cx="${x + .05}" cy="${y + .3}" rx=".3" ry=".1" fill="rgba(0,0,0,.28)"/>` +
        `<circle cx="${x}" cy="${y}" r=".34" fill="url(#g${side})" stroke="${side === "b" ? "#000" : "#9c927e"}" stroke-width=".025"/>` +
        `<ellipse cx="${x - .1}" cy="${y - .13}" rx=".11" ry=".07" fill="rgba(255,255,255,${side === "b" ? .35 : .8})" transform="rotate(-30 ${x - .1} ${y - .13})"/>`;
      if (p === "B" || p === "W") svg += `<path transform="translate(${x - .19} ${y - .19}) scale(${.38 / 24})" fill="#e8b923" stroke="#7a5a00" stroke-width="1.2" stroke-linejoin="round" d="M3 18 2 7l5.5 4.5L12 4l4.5 7.5L22 7l-1 11z"/>`;
    }
    if (targets.includes(i)) svg += `<circle cx="${x}" cy="${y}" r=".14" fill="rgba(0,0,0,.4)"/>`;
    if (movers.includes(i)) svg += `<circle cx="${x}" cy="${y}" r=".42" fill="none" stroke="rgba(255,200,0,.9)" stroke-width=".06"/>`;
    svg += `<circle cx="${x}" cy="${y}" r=".5" fill="transparent" data-point="${i + 1}" data-piece="${p}"/>`;
  });
  board.innerHTML = svg + "</svg>";
  board.querySelectorAll("[data-point]").forEach(el => el.onclick = () =>
    fanorona ? tapFanorona(el.dataset.point) : tapCheckers(el.dataset.point, el.dataset.piece, legal));
}

// ---------- fanorona: a turn can be several capturing steps, tapped one at a time

function fanoronaChoices() {
  // legal moves that start with the steps tapped so far
  if (!state.legal || viewPly !== null) return [];
  return state.legal.map(m => ({ move: m, pts: m.split(/[aw-]/), kinds: m.match(/[aw-]/g) }))
    .filter(c => fpath.every((p, i) => c.pts[i] === p) && fkinds.every((k, i) => c.kinds[i] === k));
}

function simulateFanorona(snapshot, pts, kinds) {
  // the board after the steps tapped so far, so the next step can be chosen from where the piece is now
  const L = state.layout, board = snapshot.split(""), at = {};
  L.points.forEach(([x, y], i) => at[x + "," + y] = i);
  for (let i = 1; i < pts.length; i++) {
    const a = pts[i - 1] - 1, b = pts[i] - 1, [ax, ay] = L.points[a], [bx, by] = L.points[b];
    const dx = bx - ax, dy = by - ay, me = board[a], enemy = me === "b" ? "w" : "b";
    let x = kinds[i - 1] === "a" ? bx + dx : ax - dx, y = kinds[i - 1] === "a" ? by + dy : ay - dy;
    const sx = kinds[i - 1] === "a" ? dx : -dx, sy = kinds[i - 1] === "a" ? dy : -dy;
    if (kinds[i - 1] !== "-") {
      while (at[x + "," + y] !== undefined && board[at[x + "," + y]] === enemy) { board[at[x + "," + y]] = "."; x += sx; y += sy; }
    }
    board[b] = me; board[a] = ".";
  }
  return board.join("");
}

function tapFanorona(point) {
  if (viewPly !== null) return goLive();
  if (busy || !(state.legal || []).length) return;
  const starts = new Set(state.legal.map(m => m.split(/[aw-]/)[0]));
  if (fpath.length <= 1 && starts.has(point)) {  // pick (or switch) the piece
    fpath = fpath[0] === point ? [] : [point]; fkinds = [];
    haptic("light"); return render();
  }
  if (!fpath.length) return;
  const next = fanoronaChoices().filter(c => c.pts.length > fpath.length && c.pts[fpath.length] === point);
  if (!next.length) return;
  const kinds = [...new Set(next.map(c => c.kinds[fpath.length - 1]))];
  if (kinds.length > 1) return chooseCapture(kind => fanoronaStep(point, kind));
  fanoronaStep(point, kinds[0]);
}

function fanoronaStep(point, kind) {
  fpath.push(point); fkinds.push(kind);
  const choices = fanoronaChoices();
  const done = choices.find(c => c.pts.length === fpath.length);
  if (done && !choices.some(c => c.pts.length > fpath.length)) return send(done.move);  // nothing more to capture
  haptic("light"); render();
}

function endFanoronaTurn() {
  const done = fanoronaChoices().find(c => c.pts.length === fpath.length);
  if (done) send(done.move);
}

function cancelFanorona() { fpath = []; fkinds = []; render(); }

function chooseCapture(then) {
  const box = document.getElementById("promoChoices");
  box.innerHTML = "";
  for (const [kind, text] of [["a", "Take the line in front"], ["w", "Take the line behind"]]) {
    const b = document.createElement("button");
    b.textContent = text; b.style.cssText = "width:auto;height:auto;padding:12px 14px";
    b.onclick = () => { document.getElementById("promo").classList.remove("open"); then(kind); };
    box.appendChild(b);
  }
  document.getElementById("promo").classList.add("open");
}

function sideInfo(kind, snapshot, reviewing) {
  // the line under each name: captured pieces (chess, checkers), disc counts (othello), captured stones (go)
  const s = state;
  if (kind === "chess") return takenPieces(parseFen(snapshot));
  const count = ch => [...snapshot].filter(x => x.toLowerCase() === ch).length;
  if (kind === "othello") {
    const n = { black: count("b"), white: count("w") };
    return { black: `<span class="taken">${n.black} discs</span>`, white: `<span class="taken">${n.white} discs</span>` };
  }
  if (kind === "checkers" || kind === "draughts" || s.layout) {  // pieces each side has taken = the opponent's missing pieces
    const start = s.layout ? s.layout.pieces : kind === "draughts" ? 16 : 12;
    const row = (victim, n) => `<span class="taken">${`<span class="chip ${victim}"></span>`.repeat(Math.min(n, 12))}${n ? `<span class="count">${n}</span>` : ""}</span>`;
    return { black: row("w", start - count("w")), white: row("b", start - count("b")) };
  }
  if (kind === "go") {
    const score = reviewing ? null : s.score;  // captures are only known for the live position
    const line = c => `<span class="taken">${score ? `${score[c]} captured` : ""}</span>`;
    return { black: line("black"), white: line("white") };
  }
  return { black: "", white: "" };
}

function takenPieces(grid) {
  // What each side has captured = the opponent's pieces missing from the board (promotions can't go below 0)
  const left = { w: {}, b: {} };
  for (const p of Object.values(grid)) {
    const side = p === p.toUpperCase() ? "w" : "b", t = p.toLowerCase();
    left[side][t] = (left[side][t] || 0) + 1;
  }
  const material = side => Object.entries(left[side]).reduce((sum, [t, n]) => sum + (VALUES[t] || 0) * n, 0);
  const diff = material("w") - material("b");
  const row = (victim, adv) => {
    let html = "", prev = null;
    for (const t of ["p", "n", "b", "r", "q"]) {
      const n = Math.max(0, START[t] - (left[victim][t] || 0));
      for (let i = 0; i < n; i++) {
        html += `<span class="cap${prev && prev !== t ? " gap" : ""}">${PIECES[victim + t.toUpperCase()]}</span>`;
        prev = t;
      }
    }
    return `<span class="taken">${html}${adv > 0 ? `<span class="adv">+${adv}</span>` : ""}</span>`;
  };
  return { white: row("b", diff), black: row("w", -diff) };
}

// ---------- moving

function tapChess(sq, grid, legal) {
  const s = state;
  if (viewPly !== null) return goLive();  // tapping the board while looking back returns to the game
  if (busy || !legal.length) return;
  const mine = p => p && (p === p.toUpperCase()) === (s.you === "white");
  if (selected) {
    const options = legal.filter(m => m.startsWith(selected + sq));
    if (options.length === 1) return send(options[0]);
    if (options.length > 1) return choosePromotion(options, s.you);
  }
  selected = mine(grid[sq]) && legal.some(m => m.startsWith(sq)) ? (selected === sq ? null : sq) : null;
  if (selected) haptic("light");
  render();
}

function tapCheckers(name, piece, legal) {
  if (viewPly !== null) return goLive();
  if (busy || !legal.length || name === null) return;
  if (selected) {
    // the longest jump that starts here and ends on the tapped square
    const options = legal.filter(m => { const sq = pathOf(m); return sq[0] === selected && sq[sq.length - 1] === name; });
    if (options.length) return send(options.sort((a, b) => b.length - a.length)[0]);
  }
  selected = legal.some(m => pathOf(m)[0] === name) ? (selected === name ? null : name) : null;
  if (selected) haptic("light");
  render();
}

function tapPlace(name, legal) {
  if (viewPly !== null) return goLive();
  if (busy || !legal.includes(name)) return;
  send(name);
}

function choosePromotion(options, color) {
  const box = document.getElementById("promoChoices");
  box.innerHTML = "";
  for (const piece of ["q", "r", "b", "n"]) {
    const move = options.find(m => m.endsWith(piece));
    if (!move) continue;
    const b = document.createElement("button");
    b.innerHTML = `<span class="piece">${PIECES[color[0] + piece.toUpperCase()]}</span>`;
    b.onclick = () => { document.getElementById("promo").classList.remove("open"); send(move); };
    box.appendChild(b);
  }
  document.getElementById("promo").classList.add("open");
}

async function send(move) {
  if (busy) return;
  busy = true; selected = null; fpath = []; fkinds = [];
  if (state.bot) {
    const st = document.getElementById("status");
    st.textContent = "Laden is thinking…"; st.className = "status";
  }
  try { state = await api("move", { move }); haptic("medium"); }
  catch (e) { tg ? tg.showAlert(e.message) : alert(e.message); }
  busy = false; render();
}

function resign() {
  const go = ok => ok && act("resign");
  tg ? tg.showConfirm("Resign this game?", go) : go(confirm("Resign this game?"));
}

async function act(action) {
  if (busy) return;
  busy = true;
  try { state = await api(action); } catch (e) { tg ? tg.showAlert(e.message) : alert(e.message); }
  busy = false; render();
}

// ---------- looking back through the game

function moveLabel(ply) {
  const no = Math.ceil(ply / 2);
  return `${no}${ply % 2 ? "." : "…"} ${state.labels[ply - 1]}`;
}

function step(delta) {
  const total = state.labels.length;
  const at = viewPly === null ? total : viewPly;
  const next = Math.min(total, Math.max(0, at + delta));
  viewPly = next >= total ? null : next;
  haptic("light"); render();
}

function goLive() { viewPly = null; render(); }

function showPly(ply) { viewPly = ply >= state.labels.length ? null : ply; closeMoves(); render(); }

function fillMoves() {
  const list = document.getElementById("movelist");
  const at = viewPly === null ? state.labels.length : viewPly;
  if (!state.labels.length) { list.innerHTML = `<div class="empty">No moves yet.</div>`; return; }
  let html = "";
  state.labels.forEach((label, i) => {
    if (i % 2 === 0) html += `<span class="no">${i / 2 + 1}.</span>`;
    html += `<span class="mv${i + 1 === at ? " on" : ""}" onclick="showPly(${i + 1})">${esc(label)}</span>`;
  });
  list.innerHTML = html;
  const on = list.querySelector(".on");
  if (on) on.scrollIntoView({ block: "center" });
}

function openMoves() { fillMoves(); document.getElementById("sheet").classList.add("open"); }
function closeMoves() { document.getElementById("sheet").classList.remove("open"); }

// ---------- dice games: snakes and ladders, ludo

let slide = {};  // player -> [x, y] while their counter slides along a snake or ladder
let animating = false, queuedState = null;
const sleep = ms => new Promise(r => setTimeout(r, ms));
const pace = ms => sleep(queuedState ? ms * .3 : ms);  // newer moves are waiting: hurry to catch up

async function showParty(fresh) {
  // Show a new dice-game state, moving counters and tokens step by step instead of jumping
  if (!state || !state.party || !state.state || !fresh.state || fresh.kind !== state.kind) { state = fresh; return render(); }
  if (animating) { queuedState = fresh; return; }
  animating = true;
  const old = state;
  try {
    if (fresh.kind === "snakes") await animateSnakes(old, fresh);
    else await animateLudo(old, fresh);
  } catch (e) {}
  slide = {}; state = fresh; animating = false; render();
  if (queuedState) { const next = queuedState; queuedState = null; showParty(next); }
}

function frame(fresh, changes) {
  // draw the new state (log, dice, turn) with pieces where the animation has got to
  state = { ...fresh, movable: [], state: { ...fresh.state, ...changes } };
  renderParty();
}

async function animateSnakes(old, fresh) {
  const L = fresh.layout, pos = [...old.state.pos];
  const rolled = fresh.state.last_roll || [];
  frame(fresh, { pos: [...pos] });
  for (let i = 0; i < pos.length; i++) {
    const a = old.state.pos[i], b = fresh.state.pos[i];
    // each player's own last roll (several players can move between two updates)
    const dice = rolled[i] || fresh.state.dice, landed = a + dice;
    const jump = landed <= 100 && landed !== b && (L.ladders[landed] === b || L.snakes[landed] === b);
    // a snake can drop you back where you started (e.g. 53 → 56 → 53): still show the move, but only if this
    // player really rolled (their turn has passed since the old state)
    if (a === b && !(jump && old.state.turn === i && fresh.state.rolls !== old.state.rolls)) continue;
    const end = jump ? landed : (b > a && b - a <= 6 ? b : null);
    if (end !== null) {
      for (let sq = a + 1; sq <= end; sq++) { pos[i] = sq; frame(fresh, { pos: [...pos] }); await pace(140); }
    }
    if (jump) {  // slide along the ladder or snake
      await pace(120);
      const [x1, y1] = snakesCell(landed), [x2, y2] = snakesCell(b);
      for (let k = 1; k <= 12; k++) { slide = { [i]: [x1 + (x2 - x1) * k / 12, y1 + (y2 - y1) * k / 12] }; frame(fresh, { pos: [...pos] }); await pace(35); }
      slide = {};
    }
    pos[i] = b; frame(fresh, { pos: [...pos] });
  }
}

async function animateLudo(old, fresh) {
  const tokens = old.state.tokens.map(t => [...t]);
  frame(fresh, { tokens: tokens.map(t => [...t]) });
  const captured = [];
  for (let i = 0; i < tokens.length; i++) for (let t = 0; t < 4; t++) {
    const a = old.state.tokens[i][t], b = fresh.state.tokens[i][t];
    if (a === b) continue;
    if (b === -1) { captured.push([i, t]); continue; }  // knocked back: shown after the move that did it
    if (a === -1) { tokens[i][t] = 0; frame(fresh, { tokens: tokens.map(x => [...x]) }); await pace(200); continue; }
    for (let p = a + 1; p <= b; p++) { tokens[i][t] = p; frame(fresh, { tokens: tokens.map(x => [...x]) }); await pace(110); }
  }
  if (captured.length) {
    await pace(160);
    for (const [i, t] of captured) tokens[i][t] = -1;
    frame(fresh, { tokens: tokens.map(x => [...x]) });
  }
}

const PARTY_COLOURS = ["#e53935", "#43a047", "#fbc02d", "#1e88e5", "#8e24aa", "#fb8c00"];
const LUDO_COLOURS = { red: "#e53935", green: "#43a047", yellow: "#fbc02d", blue: "#1e88e5" };
const DICE = ["", "⚀", "⚁", "⚂", "⚃", "⚄", "⚅"];
let lastDice = null;

function playerColour(i) {
  const p = state.players[i];
  return p.colour ? LUDO_COLOURS[p.colour] : PARTY_COLOURS[i % PARTY_COLOURS.length];
}

function renderParty() {
  const s = state;
  document.getElementById("game").classList.add("hidden");
  const party = document.getElementById("party");
  const emoji = s.kind === "ludo" ? "🎲" : "🐍";
  if (s.status === "waiting") {
    party.classList.add("hidden");
    const names = s.players.map(p => `<b>${esc(p.name)}</b>`).join(", ");
    const waiting = s.invited.filter(n => !s.players.some(p => p.name === n));
    let html = `<div class="big">${emoji}</div><h2>${esc(s.title)}</h2><p>${s.min}–${s.max} players<br>Joined: ${names}` +
      (waiting.length ? `<br>Waiting for: ${waiting.map(esc).join(", ")}` : s.invited.length ? "" : "<br>Anyone in the group can join.") + "</p>";
    if (s.can_join) html += `<button class="primary" onclick="act('join')">Join the game</button>`;
    else if (s.you !== null && !s.can_start) html += `<p>Waiting for ${esc(s.host)} to start…</p>`;
    if (s.can_add_bot) html += `<div class="actions"><button onclick="act('add_bot')">🤖 Add a bot</button></div>`;
    if (s.can_start) html += `<div class="actions"><button class="primary" onclick="act('start')">Start with ${s.players.length} players</button></div>`;
    if (s.can_cancel) html += `<div class="actions"><button class="danger" onclick="act('cancel')">Cancel game</button></div>`;
    return showMessage(html);
  }
  if (s.status === "private") {
    party.classList.add("hidden");
    return showMessage(`<div class="big">🔒</div><h2>${esc(s.title)}</h2><p>This game is private while it's being played. Laden will post the result in the group.</p>`);
  }
  if (!s.state) {
    party.classList.add("hidden");
    return showMessage(`<div class="big">${emoji}</div><h2>Game cancelled</h2><p>Start a new one in the group.</p>`);
  }
  document.getElementById("message").classList.add("hidden");
  party.classList.remove("hidden");
  const st = s.state, myTurn = s.status === "playing" && s.you === st.turn;

  document.getElementById("plist").innerHTML = s.players.map((p, i) => {
    const info = s.kind === "ludo" ? `${st.tokens[i].filter(t => t === 56).length}/4 home` : (st.pos[i] ? `on ${st.pos[i]}` : "at start");
    const gone = (s.left || [])[i], place = (st.standings || st.finished || []).indexOf(i) + 1;
    const badge = place && !gone ? `${["🏆", "🥈", "🥉"][place - 1] || "🏁"} ${ordinal(place)}` : gone ? "left" : info;
    return `<span class="pchip${i === st.turn && s.status === "playing" ? " turn" : ""}"${gone ? ' style="opacity:.5"' : ""}><span class="pdot" style="background:${playerColour(i)}"></span>` +
      `${esc(p.name)}${i === s.you ? " (you)" : ""} <span class="pinfo">${badge}</span></span>`;
  }).join("");

  document.getElementById("pboard").innerHTML = s.kind === "ludo" ? ludoBoard() : snakesBoard();
  document.querySelectorAll("#pboard [data-token]").forEach(el => el.onclick = () => moveToken(+el.dataset.token));

  const die = document.getElementById("die");
  die.textContent = st.dice ? DICE[st.dice] : "🎲";
  if (st.dice && lastDice !== null && JSON.stringify(s.log) !== lastDice) { die.classList.remove("rolling"); void die.offsetWidth; die.classList.add("rolling"); }
  lastDice = JSON.stringify(s.log);
  const btn = document.getElementById("rollBtn");
  btn.disabled = !myTurn || st.phase !== "roll" || busy;
  btn.classList.toggle("hidden", s.status !== "playing");
  partyStatus();
  document.getElementById("plog").innerHTML = s.log.slice(-8).reverse().map(e => `<div>${esc(e)}</div>`).join("");
  const iLeft = s.you !== null && ((s.left || [])[s.you] || (st.finished || []).includes(s.you));
  document.getElementById("leaveBtn").classList.toggle("hidden", s.status !== "playing" || s.you === null || iLeft);
}

function ordinal(n) { return n + ((n % 100 >= 11 && n % 100 <= 13) ? "th" : ({ 1: "st", 2: "nd", 3: "rd" }[n % 10] || "th")); }

function partyStatus() {
  const s = state, st = s.state, el = document.getElementById("pstatus");
  if (!st || !el) return;
  el.className = "status";
  if (s.status === "over") {
    el.textContent = s.result === "abandoned" || st.winner === null ? "Game abandoned: nobody was playing." : `🏆 ${s.players[st.winner].name} won!`;
    el.classList.add("strong"); return;
  }
  const left = Math.max(0, Math.round(s.seconds_left - (performance.now() - s.receivedAt) / 1000));
  const myPlace = s.you !== null ? (st.finished || []).indexOf(s.you) + 1 : 0;
  if (myPlace) {
    el.textContent = `You finished ${ordinal(myPlace)}! The others play on. ${s.players[st.turn].name}'s turn ⏱ ${left}s`;
  } else if (s.you !== null && (s.left || [])[s.you]) {
    el.textContent = `You left the game. ${s.players[st.turn].name}'s turn ⏱ ${left}s`;
  } else if (s.you === st.turn) {
    el.textContent = (st.phase === "roll" ? "Your turn: roll!" : `You rolled ${st.dice}: tap a token to move.`) + ` ⏱ ${left}s`;
    el.classList.add("strong");
  } else {
    el.textContent = `${s.players[st.turn].name}'s turn ⏱ ${left}s`;
  }
}
setInterval(() => { if (state && state.party && state.status === "playing") partyStatus(); }, 1000);

const SNAKE_COLOURS = [["#2e7d32", "#a5d6a7"], ["#6a1b9a", "#e1bee7"], ["#e65100", "#ffcc80"], ["#c62828", "#ffcdd2"],
  ["#00695c", "#b2dfdb"], ["#4e342e", "#d7ccc8"], ["#283593", "#c5cae9"], ["#9e9d24", "#f0f4c3"], ["#ad1457", "#f8bbd0"], ["#1565c0", "#bbdefb"]];
const TILE_COLOURS = ["#ff8a80", "#ffd180", "#ffff8d", "#b9f6ca", "#80d8ff", "#cf9fff"];

function pawn(x, y, r, colour, label, id) {
  // a glossy playing piece: shadow, base, body, head, shine (and the player's initial)
  return `<g>` +
    `<ellipse cx="${x}" cy="${y + r * .95}" rx="${r * .95}" ry="${r * .3}" fill="rgba(0,0,0,.3)"/>` +
    `<path d="M${x - r * .78} ${y + r * .85} Q${x} ${y + r * 1.12} ${x + r * .78} ${y + r * .85} L${x + r * .42} ${y - r * .05} Q${x} ${y - r * .28} ${x - r * .42} ${y - r * .05} Z" fill="${colour}" stroke="rgba(0,0,0,.55)" stroke-width="${r * .08}"/>` +
    `<circle cx="${x}" cy="${y - r * .48}" r="${r * .5}" fill="${colour}" stroke="rgba(0,0,0,.55)" stroke-width="${r * .08}"/>` +
    `<ellipse cx="${x - r * .17}" cy="${y - r * .66}" rx="${r * .17}" ry="${r * .11}" fill="rgba(255,255,255,.75)"/>` +
    `<path d="M${x - r * .5} ${y + r * .55} Q${x - r * .35} ${y + r * .1} ${x - r * .2} ${y + r * .05}" stroke="rgba(255,255,255,.45)" stroke-width="${r * .1}" fill="none" stroke-linecap="round"/>` +
    (label ? `<text x="${x}" y="${y + r * .72}" font-size="${r * .62}" font-weight="700" text-anchor="middle" fill="#fff" stroke="rgba(0,0,0,.45)" stroke-width="${r * .05}" font-family="sans-serif">${esc(label)}</text>` : "") +
    (id !== undefined ? `<circle cx="${x}" cy="${y}" r="${r * 1.4}" fill="transparent" data-token="${id}" style="cursor:pointer"/>` : "") +
    `</g>`;
}

function snakesCell(n) {
  const i = n - 1, row = Math.floor(i / 10), col = row % 2 === 0 ? i % 10 : 9 - (i % 10);
  return [col + .5, 9 - row + .5];
}

function bezier(p0, p1, p2, p3, t) {
  const u = 1 - t;
  return [u * u * u * p0[0] + 3 * u * u * t * p1[0] + 3 * u * t * t * p2[0] + t * t * t * p3[0],
          u * u * u * p0[1] + 3 * u * u * t * p1[1] + 3 * u * t * t * p2[1] + t * t * t * p3[1]];
}

function snakesBoard() {
  const s = state, L = s.layout;
  let svg = `<svg viewBox="-.35 -.35 10.7 10.7" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <linearGradient id="sframe" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1b5e20"/><stop offset=".5" stop-color="#2e7d32"/><stop offset="1" stop-color="#1b5e20"/></linearGradient>
      <linearGradient id="rail" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#7b4a1e"/><stop offset=".5" stop-color="#d9a066"/><stop offset="1" stop-color="#7b4a1e"/></linearGradient>
      <radialGradient id="tileshine" cx=".3" cy=".25" r=".9"><stop offset="0" stop-color="rgba(255,255,255,.55)"/><stop offset="1" stop-color="rgba(255,255,255,0)"/></radialGradient>
    </defs>
    <rect x="-.35" y="-.35" width="10.7" height="10.7" rx=".45" fill="url(#sframe)"/>
    <rect x="-.12" y="-.12" width="10.24" height="10.24" rx=".2" fill="#fffde7"/>`;
  for (let n = 1; n <= 100; n++) {  // rainbow tiles running diagonally, each with a soft shine
    const [x, y] = snakesCell(n), row = Math.floor((n - 1) / 10), col = Math.round(x - .5);
    const colour = TILE_COLOURS[(row + col) % TILE_COLOURS.length];
    svg += `<rect x="${x - .47}" y="${y - .47}" width=".94" height=".94" rx=".12" fill="${colour}"/>` +
      `<rect x="${x - .47}" y="${y - .47}" width=".94" height=".94" rx=".12" fill="url(#tileshine)"/>`;
    if (n === 1) svg += `<text x="${x}" y="${y + .14}" font-size=".24" font-weight="800" text-anchor="middle" fill="#1b5e20" font-family="sans-serif">START</text>`;
    else if (n === 100) svg += `<text x="${x}" y="${y + .2}" font-size=".5" text-anchor="middle">🏁</text>`;
    svg += `<text x="${x - .4}" y="${y - .24}" font-size=".21" font-weight="700" fill="rgba(0,0,0,.5)" font-family="sans-serif">${n}</text>`;
  }
  for (const [from, to] of Object.entries(L.ladders)) {  // wooden ladders with a shadow
    const [x1, y1] = snakesCell(+from), [x2, y2] = snakesCell(+to);
    const len = Math.hypot(x2 - x1, y2 - y1), nx = -(y2 - y1) / len * .17, ny = (x2 - x1) / len * .17;
    let rungs = "";
    for (let t = .1; t < .95; t += .32 / len) {
      const x = x1 + (x2 - x1) * t, y = y1 + (y2 - y1) * t;
      rungs += `<line x1="${x + nx}" y1="${y + ny}" x2="${x - nx}" y2="${y - ny}"/>`;
    }
    svg += `<g stroke-linecap="round" transform="translate(.06 .08)" stroke="rgba(0,0,0,.22)" stroke-width=".1">` +
      `<line x1="${x1 + nx}" y1="${y1 + ny}" x2="${x2 + nx}" y2="${y2 + ny}"/><line x1="${x1 - nx}" y1="${y1 - ny}" x2="${x2 - nx}" y2="${y2 - ny}"/>${rungs}</g>` +
      `<g stroke-linecap="round" stroke="#6d3f17" stroke-width=".07">${rungs}</g><g stroke-linecap="round" stroke="#d9a066" stroke-width=".035">${rungs}</g>` +
      `<g stroke-linecap="round"><line x1="${x1 + nx}" y1="${y1 + ny}" x2="${x2 + nx}" y2="${y2 + ny}" stroke="#6d3f17" stroke-width=".1"/>` +
      `<line x1="${x1 - nx}" y1="${y1 - ny}" x2="${x2 - nx}" y2="${y2 - ny}" stroke="#6d3f17" stroke-width=".1"/>` +
      `<line x1="${x1 + nx}" y1="${y1 + ny}" x2="${x2 + nx}" y2="${y2 + ny}" stroke="#d9a066" stroke-width=".04"/>` +
      `<line x1="${x1 - nx}" y1="${y1 - ny}" x2="${x2 - nx}" y2="${y2 - ny}" stroke="#d9a066" stroke-width=".04"/></g>`;
  }
  Object.entries(L.snakes).forEach(([from, to], k) => {  // tapered, spotted snakes with eyes and a forked tongue
    const [dark, light] = SNAKE_COLOURS[k % SNAKE_COLOURS.length];
    const p0 = snakesCell(+from), p3 = snakesCell(+to);
    const dx = p3[0] - p0[0], dy = p3[1] - p0[1], len = Math.hypot(dx, dy), nx = -dy / len, ny = dx / len, w = Math.min(1, len / 3.5);
    const p1 = [p0[0] + dx * .3 + nx * w, p0[1] + dy * .3 + ny * w], p2 = [p0[0] + dx * .68 - nx * w, p0[1] + dy * .68 - ny * w];
    const pts = Array.from({ length: 31 }, (_, i) => bezier(p0, p1, p2, p3, i / 30));
    let shadow = "", body = "", spots = "";
    for (let i = 0; i < 30; i++) {
      const [ax, ay] = pts[i], [bx, by] = pts[i + 1], width = .34 - .26 * (i / 30);
      shadow += `<line x1="${ax + .07}" y1="${ay + .09}" x2="${bx + .07}" y2="${by + .09}" stroke-width="${width}"/>`;
      body += `<line x1="${ax}" y1="${ay}" x2="${bx}" y2="${by}" stroke-width="${width}"/>`;
      if (i % 3 === 1) spots += `<circle cx="${(ax + bx) / 2}" cy="${(ay + by) / 2}" r="${width * .22}"/>`;
    }
    const [hx, hy] = p0, ux = (pts[1][0] - hx), uy = (pts[1][1] - hy), ul = Math.hypot(ux, uy), fx = -ux / ul, fy = -uy / ul;
    const angle = Math.atan2(fy, fx) * 180 / Math.PI;
    svg += `<g stroke-linecap="round" stroke="rgba(0,0,0,.2)">${shadow}</g><g stroke-linecap="round" stroke="${dark}">${body}</g>` +
      `<g fill="${light}" opacity=".85">${spots}</g>` +
      `<g transform="translate(${hx} ${hy}) rotate(${angle})">` +
      `<path d="M.28 0 L.48 0 M.48 0 L.56 -.06 M.48 0 L.56 .06" stroke="#e53935" stroke-width=".035" fill="none" stroke-linecap="round"/>` +
      `<ellipse cx=".04" cy="0" rx=".3" ry=".22" fill="${dark}"/>` +
      `<circle cx=".12" cy="-.1" r=".07" fill="#fff"/><circle cx=".12" cy=".1" r=".07" fill="#fff"/>` +
      `<circle cx=".14" cy="-.1" r=".035" fill="#111"/><circle cx=".14" cy=".1" r=".035" fill="#111"/></g>`;
  });
  const spots = {};
  s.state.pos.forEach((p, i) => { if (p && !(i in slide)) (spots[p] = spots[p] || []).push(i); });
  for (const [i, [x, y]] of Object.entries(slide))  // a counter sliding along a snake or ladder
    svg += pawn(x, y, .3, playerColour(+i), s.players[+i].name.trim()[0]);
  for (const [square, who] of Object.entries(spots)) {
    const [x, y] = snakesCell(+square);
    who.forEach((i, k) => {
      const ox = who.length > 1 ? (k % 2 - .5) * .4 : 0, oy = who.length > 1 ? (Math.floor(k / 2) - .3) * .34 : 0;
      svg += pawn(x + ox, y + oy, who.length > 1 ? .22 : .3, playerColour(i), s.players[i].name.trim()[0]);
    });
  }
  return svg + "</svg>";
}

function ludoBoard() {
  const s = state, st = s.state, L = s.layout;
  const quadrant = { red: [0, 0], green: [0, 9], yellow: [9, 9], blue: [9, 0] };
  const dark = { red: "#b71c1c", green: "#1b5e20", yellow: "#f57f17", blue: "#0d47a1" };
  const star = (cx, cy, r, fill) => `<polygon points="${Array.from({ length: 10 }, (_, k) => {
    const a = Math.PI / 5 * k - Math.PI / 2, rr = k % 2 ? r * .45 : r;
    return `${cx + Math.cos(a) * rr},${cy + Math.sin(a) * rr}`; }).join(" ")}" fill="${fill}" stroke="rgba(0,0,0,.25)" stroke-width=".03"/>`;
  let svg = `<svg viewBox="-.35 -.35 15.7 15.7" xmlns="http://www.w3.org/2000/svg"><defs>` +
    Object.entries(LUDO_COLOURS).map(([c, hex]) =>
      `<linearGradient id="q${c}" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="${hex}"/><stop offset="1" stop-color="${dark[c]}"/></linearGradient>`).join("") +
    `</defs><rect x="-.35" y="-.35" width="15.7" height="15.7" rx=".5" fill="#3e2723"/>` +
    `<rect x="-.12" y="-.12" width="15.24" height="15.24" rx=".3" fill="#fffaf0"/>`;
  for (const [colour, [r, c]] of Object.entries(quadrant)) {  // each colour's yard
    svg += `<rect x="${c + .05}" y="${r + .05}" width="5.9" height="5.9" rx=".35" fill="url(#q${colour})"/>` +
      `<rect x="${c + 1.05}" y="${r + 1.12}" width="3.9" height="3.9" rx=".5" fill="rgba(0,0,0,.18)"/>` +
      `<rect x="${c + 1}" y="${r + 1}" width="4" height="4" rx=".5" fill="#fff"/>`;
    for (const [dr, dc] of [[2, 2], [2, 4], [4, 2], [4, 4]])
      svg += `<circle cx="${c + dc}" cy="${r + dr}" r=".62" fill="${LUDO_COLOURS[colour]}" opacity=".22"/>` +
        `<circle cx="${c + dc}" cy="${r + dr}" r=".62" fill="none" stroke="${LUDO_COLOURS[colour]}" stroke-width=".07"/>`;
  }
  const startOf = i => Object.entries(L.offset).find(([, o]) => o === i);
  L.track.forEach(([r, c], i) => {
    const start = startOf(i);
    svg += `<rect x="${c + .03}" y="${r + .03}" width=".94" height=".94" rx=".1" fill="${start ? LUDO_COLOURS[start[0]] : "#fff"}" stroke="#d6cfc2" stroke-width=".04"/>`;
    if (start) svg += star(c + .5, r + .5, .3, "#fff");
    else if (L.safe.includes(i)) svg += star(c + .5, r + .5, .32, "#ffc107");
  });
  for (const [colour, cells] of Object.entries(L.home_columns)) {
    for (const [r, c] of cells) svg += `<rect x="${c + .03}" y="${r + .03}" width=".94" height=".94" rx=".1" fill="url(#q${colour})" stroke="rgba(0,0,0,.12)" stroke-width=".03"/>`;
    // an arrow on the square where this colour turns into its home column
    const [er, ec] = L.track[(L.offset[colour] + 50) % 52], [hr, hc] = cells[0];
    const ang = Math.atan2(hr - er, hc - ec) * 180 / Math.PI;
    svg += `<g transform="translate(${ec + .5} ${er + .5}) rotate(${ang})"><path d="M-.25 -.18 L.15 0 L-.25 .18 Z M-.32 0 L.05 0" fill="${LUDO_COLOURS[colour]}" stroke="${LUDO_COLOURS[colour]}" stroke-width=".08" stroke-linejoin="round"/></g>`;
  }
  svg += `<polygon points="6,6 7.5,7.5 6,9" fill="url(#qred)"/><polygon points="6,6 9,6 7.5,7.5" fill="url(#qgreen)"/>` +
    `<polygon points="9,6 9,9 7.5,7.5" fill="url(#qyellow)"/><polygon points="6,9 9,9 7.5,7.5" fill="url(#qblue)"/>` +
    `<circle cx="7.5" cy="7.5" r=".62" fill="#fff" stroke="rgba(0,0,0,.2)" stroke-width=".04"/>` + star(7.5, 7.5, .45, "#ffc107");
  const homeSpot = { red: [6.55, 7.5], green: [7.5, 6.55], yellow: [8.45, 7.5], blue: [7.5, 8.45] };
  const places = {};  // where each token is drawn, grouped so tokens on one square fan out
  st.tokens.forEach((tokens, i) => tokens.forEach((p, t) => {
    const colour = st.colours[i];
    let x, y;
    if (p === -1) { const [r, c] = quadrant[colour], [dr, dc] = [[2, 2], [2, 4], [4, 2], [4, 4]][t]; x = c + dc; y = r + dr; }
    else if (p <= 50) { const [r, c] = L.track[(L.offset[colour] + p) % 52]; x = c + .5; y = r + .5; }
    else if (p < 56) { const [r, c] = L.home_columns[colour][p - 51]; x = c + .5; y = r + .5; }
    else [x, y] = homeSpot[colour];
    (places[x + "," + y] = places[x + "," + y] || []).push({ x, y, i, t, colour });
  }));
  const movable = s.movable || [];
  for (const group of Object.values(places)) {
    group.forEach((tok, k) => {
      const spread = group.length > 1 ? .2 : 0, ox = spread * (k % 2 ? 1 : -1), oy = spread * (k > 1 ? 1 : -1) * (group.length > 2 ? 1 : 0);
      const mine = tok.i === s.you && movable.includes(tok.t), r = group.length > 1 ? .27 : .36;
      if (mine) svg += `<circle class="token can" cx="${tok.x + ox}" cy="${tok.y + oy}" r="${r * 1.45}" fill="none" stroke="#fff" stroke-width=".09"/>`;
      svg += pawn(tok.x + ox, tok.y + oy - r * .1, r, LUDO_COLOURS[tok.colour], "", mine ? tok.t : undefined);
    });
  }
  return svg + "</svg>";
}

async function roll() {
  if (busy) return;
  busy = true; document.getElementById("rollBtn").disabled = true;
  let fresh = null;
  try { fresh = await api("roll"); haptic("heavy"); } catch (e) { tg ? tg.showAlert(e.message) : alert(e.message); }
  busy = false;
  if (fresh) showParty(fresh); else render();
}

async function moveToken(token) {
  if (busy) return;
  busy = true;
  let fresh = null;
  try { fresh = await api("move", { token }); haptic("medium"); } catch (e) { tg ? tg.showAlert(e.message) : alert(e.message); }
  busy = false;
  if (fresh) showParty(fresh); else render();
}

// ---------- clocks and staying in sync

function clockText(t) {
  if (t < 10) return `0:0${t.toFixed(1)}`;
  const secs = Math.ceil(t);
  return `${Math.floor(secs / 60)}:${String(secs % 60).padStart(2, "0")}`;
}

let flagCheck = 0;
function tickClocks() {
  const s = state;
  if (!s || !s.clock) return;
  const elapsed = (performance.now() - s.receivedAt) / 1000;
  for (const el of document.querySelectorAll(".clock")) {
    const c = el.dataset.color, running = s.running === c && s.status === "playing";
    const left = Math.max(0, s.clock[c] - (running ? elapsed : 0));
    el.textContent = clockText(left);
    el.classList.toggle("running", running);
    el.classList.toggle("low", left < 30);
    if (running && left === 0 && !busy && performance.now() - flagCheck > 1500) {
      flagCheck = performance.now();  // time's up here: ask the server to end the game
      api("state").then(fresh => { state = fresh; render(); }).catch(() => {});
    }
  }
}
setInterval(tickClocks, 200);

function botToMove() {
  const s = state;
  if (!s || s.status !== "playing") return false;
  if (s.party) return !!(s.state && s.players[s.state.turn] && s.players[s.state.turn].bot);
  return s.bot && s.turn !== s.you;
}

async function poll() {
  if (!busy && !animating && !document.hidden && state && state.status !== "over") {
    try {
      const fresh = await api("state");
      if (fresh.version !== state.version || fresh.status !== state.status) {
        if (state.status === "playing" && fresh.turn === fresh.you && state.turn !== fresh.turn) haptic("medium");
        selected = null; fpath = []; fkinds = [];
        if (fresh.party) showParty(fresh); else { state = fresh; render(); }
      } else {
        const awayChanged = fresh.away !== state.away || fresh.away_left !== state.away_left;
        state.clock = fresh.clock; state.seconds_left = fresh.seconds_left;  // stay in sync with the server's clock
        state.running = fresh.running; state.away = fresh.away; state.away_left = fresh.away_left;
        state.receivedAt = fresh.receivedAt;
        if (awayChanged && !fresh.party) render();
      }
    } catch (e) {}
  }
  const quick = botToMove() || animating || (state && state.party && state.status === "playing");
  setTimeout(poll, quick ? (botToMove() ? 500 : 600) : 2000);  // check often during dice games and while a bot plays
}

(async () => {
  if (!gameId) return showMessage(`<div class="big">♟</div><h2>No game</h2><p>Start one in the group with a game command like /chessmatch or /ludo.</p>`);
  try { state = await api("state"); render(); }
  catch (e) { return showMessage(`<div class="big">♟</div><h2>Can't open the game</h2><p>${esc(e.message)}</p>`); }
  poll();
})();
</script>
